name: build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'AUTHORS'
      - 'metadata/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE-*'
      - 'AUTHORS'
      - 'metadata/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Spotless + unit tests + assemble
        run: ./gradlew spotlessCheck testDebugUnitTest assembleDebug --no-daemon
